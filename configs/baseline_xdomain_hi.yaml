# Cross-domain validation, higher-fidelity run: same MAURITIUS/ID holdout as baseline_xdomain,
# but at the backbone's native 384px and more epochs. Trains on the A100; the best-AuDET epoch is
# checkpointed, so overfitting in later epochs is fine (we keep the best, not the last).
name: baseline_xdomain_hi
seed: 42

# data
data_dir: data
image_size: 384             # up from 224 — tf_efficientnetv2_s's native eval resolution
val_fraction: 0.1           # ignored when val_types is set
val_types: ["MAURITIUS/ID"] # held out entirely as val; train sees only the other 4 types

# model
backbone: tf_efficientnetv2_s.in21k
pretrained: true

# train
epochs: 10
batch_size: 64
lr: 0.0003
weight_decay: 0.0001
num_workers: 8              # 384px decode is heavier; box has 11 CPUs
