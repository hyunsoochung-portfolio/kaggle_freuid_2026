# configs/finetune_v1.yaml
# DINOv2 -> DINOv3 backbone swap on top of finetune_v0's exact recipe. Same model_type=baseline
# path (timm.create_model + zero-init head, full end-to-end fine-tune) -- NOT the frozen-backbone
# consistency path. DINOv3 ViT-B/16 is available directly as a timm tag
# (vit_base_patch16_dinov3.lvd1689m, timm>=1.0.27, confirmed on the VESSL workspace), so
# CLAUDE.md's "prefer timm tags if available" guidance is satisfied and backbone.py's
# cautioned torch.hub/transformers loader (parked, consistency-path only) is untouched.
#
# Everything below is IDENTICAL to finetune_v0.yaml except: backbone, image_size, and tta scales
# (patch size changes 14 -> 16, so 518/476/560 are no longer valid multiples). Confirmed via
# scripts/config_diff.py against finetune_v0.yaml.
#
# CAUTION (CLAUDE.md): DINOv3 weights carry Meta's custom license (timm reports
# license='dinov3-license', not Apache-2.0) -- do not use in a ranked submission without
# checking license compatibility with this repo's Apache-2.0 release first.

name: finetune_v1
seed: 42
data_dir: data

# DINOv3 ViT-B/16 w/ register tokens, timm tag (verified on VESSL: timm.list_models finds it
# under timm/vit_base_patch16_dinov3.lvd1689m; 12 blocks, reg_token present, dynamic_img_size=True
# accepts 448/512px forward passes with no pos-embed error; mean/std identical to ImageNet
# defaults this repo already uses elsewhere, so no transform changes needed).
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
# Patch size 16 -> every input side / TTA scale must be a multiple of 16. 518 (DINOv2's size)
# isn't valid here; 512 = 32x16 is the closest multiple, kept close to finetune_v0's resolution
# for a fair comparison.
image_size: 512

epochs: 20
batch_size:
  32 # unchanged from finetune_v0; revisit train_last_k_blocks/grad_checkpointing if this
  # doesn't fit (DINOv3 @512 has fewer patch tokens than DINOv2 @518 -- (512/16)^2=1024 vs
  # (518/14)^2=1369 -- so memory/throughput should be no worse).
lr:
  1.0e-4 # unchanged from finetune_v0 (LLRD head/base LR)
weight_decay: 5.0e-2 # unchanged from finetune_v0
num_workers: 8

val_fraction: 0.1

extra:
  # Augmentation: print-and-capture pipeline (no flip) -- unchanged from finetune_v0
  augment: recapture

  # Synthetic tamper: 30% of bona-fide per batch become synthetic positives -- unchanged
  synth_tamper_prob: 0.3

  # Pairwise soft-AUC term -- unchanged
  auc_loss_weight: 0.1

  # Recapture probe: the compass -- unchanged
  use_recapture_probe: true
  recapture_probe_seed: 1234
  checkpoint_metric: probe_audet

  # Inference: TTA at three scales, multiples of patch_size=16 (480=16x30, 512=16x32,
  # 544=16x34), rank-averaged, no flip. Same +/-32px spacing pattern finetune_v0 used
  # (which was +/-42px = 3x14; here 2x16=32 keeps a comparable relative spread).
  tta: [480, 512, 544]

  missing_id_score: 0.5

  val_doc_types:
    - EGYPT/DL
    - GUINEA/DL
    - BENIN/DL
    - MOZAMBIQUE/DL
    - MAURITIUS/ID

  # --- Layer-wise LR decay fine-tuning -- unchanged from finetune_v0 ---
  llrd:
    enabled: true
    decay: 0.7 # per-block LR multiplier moving from head -> input
    warmup_epochs: 2 # linear warmup, then cosine decay over the remaining epochs

  # Fallback if full fine-tune doesn't fit batch_size=32: freeze all but the last k
  # transformer blocks + head. null = full fine-tune (default for this run).
  train_last_k_blocks: null

  # torch gradient checkpointing on the ViT (model.set_grad_checkpointing) -- only turn on
  # if needed to fit batch_size=32 in memory.
  grad_checkpointing: false

  # AMP (autocast + GradScaler) -- unchanged from finetune_v0.
  amp: true
