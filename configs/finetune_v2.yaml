# configs/finetune_v2.yaml
# Resolution bump on top of finetune_v0's exact recipe: 518px -> 784px, same DINOv2 ViT-B/14
# backbone, same model_type=baseline (full end-to-end fine-tune) path. Everything else is
# IDENTICAL to finetune_v0.yaml except image_size and the TTA scale list (patch size 14 means
# 518's TTA triplet isn't valid at this canvas) -- confirmed via scripts/config_diff.py.
#
# Why 784 and not 1036: reports/res_precheck/resolution_census.md found the source data's
# native min-side ceiling is ~1000px (p90 lands exactly on the 1000px bucket edge with 0% of
# images natively >=1036px) -- 784 is the highest tier the data actually supports. This is a
# genuinely additive resolution increase, not upsampling: reports/res_precheck/aug_audit.md
# confirmed recapture_transforms' resize/downscale steps are RELATIVE (safe for high-res), so
# training at 784 will actually use the extra pixels instead of learning on interpolated noise.
#
# Feasibility: reports/res_precheck/vit_dryrun.md measured this exact cell (B@784, bs=32,
# grad_ckpt=off) on the VESSL A100 at 0.677 s/it, 39.9 GB peak (comfortable margin under 80GB),
# ~7.3h projected for 20 epochs -- well inside a 16h budget.
#
# Deliberately unchanged from finetune_v0: backbone, batch_size, lr, weight_decay, LLRD,
# augmentation, synth-tamper, loss weights, probe config, AMP, grad_checkpointing. Isolating
# resolution as the only manipulated variable keeps this a clean A/B against finetune_v0's
# 0.00744 public LB (see CLAUDE.md's decisive-experiment table).

name: finetune_v2
seed: 42
data_dir: data

backbone: vit_base_patch14_reg4_dinov2.lvd142m
pretrained: true
# Patch size 14 -> every input side / TTA scale must be a multiple of 14. 784 = 56x14.
image_size: 784

epochs: 20
batch_size:
  32 # unchanged from finetune_v0; confirmed fits at 784px without grad_checkpointing
  # (39.9 GB peak / 80 GB A100 -- see reports/res_precheck/vit_dryrun.md)
lr:
  1.0e-4 # unchanged from finetune_v0 (LLRD head/base LR)
weight_decay: 5.0e-2 # unchanged from finetune_v0
num_workers: 8

val_fraction: 0.1

extra:
  # Augmentation: print-and-capture pipeline (no flip) -- unchanged from finetune_v0.
  # reports/res_precheck/aug_audit.md audited this chain specifically for 784px viability:
  # verdict = RELATIVE (safe for high-res), no gated flag needed.
  augment: recapture

  # Synthetic tamper: 30% of bona-fide per batch become synthetic positives -- unchanged
  synth_tamper_prob: 0.3

  # Pairwise soft-AUC term -- unchanged
  auc_loss_weight: 0.1

  # Recapture probe: the compass -- unchanged
  use_recapture_probe: true
  recapture_probe_seed: 1234
  checkpoint_metric: probe_audet

  # Inference: TTA at three scales, multiples of patch_size=14 (728=14x52, 784=14x56,
  # 840=14x60), rank-averaged, no flip. Matches the triplet used in the vit_res_dryrun.py
  # feasibility audit (all 3 scales confirmed to emit correct (B,1) logits on this backbone).
  tta: [728, 784, 840]

  missing_id_score: 0.5

  val_doc_types:
    - EGYPT/DL
    - GUINEA/DL
    - BENIN/DL
    - MOZAMBIQUE/DL
    - MAURITIUS/ID

  # --- Layer-wise LR decay fine-tuning -- unchanged from finetune_v0 ---
  llrd:
    enabled: true
    decay: 0.7 # per-block LR multiplier moving from head -> input
    warmup_epochs: 2 # linear warmup, then cosine decay over the remaining epochs

  # Fallback if full fine-tune doesn't fit batch_size=32: freeze all but the last k
  # transformer blocks + head. null = full fine-tune. Confirmed NOT needed at 784px
  # (see reports/res_precheck/vit_dryrun.md) -- kept null, unchanged from finetune_v0.
  train_last_k_blocks: null

  # torch gradient checkpointing -- confirmed NOT required to fit batch_size=32 at 784px
  # (39.9 GB peak vs 80 GB available). Left off: the dry-run also showed checkpointing is
  # never a net time win when the no-checkpoint config already fits (recompute overhead
  # exceeds the throughput gain from any larger batch in every measured cell).
  grad_checkpointing: false

  # AMP (autocast + GradScaler) -- unchanged from finetune_v0.
  amp: true
