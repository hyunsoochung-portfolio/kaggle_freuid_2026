# configs/bayar_dinov2_v0.yaml
# Feature-fusion experiment (branch exp/bayar+dinov2): fully fine-tuned DINOv2 ViT-B/14 +
# a gated BayarConv2d forensic-noise + RGB face-crop stream (lifted from a teammate's
# feat/overlay-detector branch), fused via a zero-init MLP head. See CLAUDE.md's
# "overlay_colab" section for the full motivating history: three score-level ensembles of
# finetune_v0 + a pretrained overlay_colab model all regressed the public LB (0.01101,
# 0.01659, 0.05319 vs 0.00744), despite overlay_colab being decisive and directionally right
# on finetune_v0's most uncertain predictions. This tests whether a JOINTLY FINE-TUNED,
# GATED fusion can learn that distinction instead of a fixed combination rule.
#
# Everything below is IDENTICAL to finetune_v0.yaml except: model_type and the new
# extra.overlay block. image_size is 518, NOT 784 -- the resolution bump already proved to
# be a wash on its own (finetune_v2); don't stack an unproven resolution change on top of
# an unproven architecture change. Confirmed via scripts/config_diff.py against
# finetune_v0.yaml.

name: bayar_dinov2_v0
seed: 42
data_dir: data

backbone: vit_base_patch14_reg4_dinov2.lvd142m
pretrained: true
image_size: 518

epochs: 20
batch_size:
  32 # unchanged from finetune_v0; revisit if the extra overlay-stream memory doesn't fit
lr:
  1.0e-4 # unchanged from finetune_v0 (LLRD head/base LR; also the base LR for the new
  # overlay/gate/fusion params -- see build_bayar_fusion_param_groups)
weight_decay: 5.0e-2 # unchanged from finetune_v0
num_workers: 8 # unlike feat/overlay-detector's num_workers=0 (MTCNN not fork-safe), face
# crops here come from the already-cached SCRFD regions (card.png + face.json), no live
# detector in the training loop -- fully fork-safe, same worker count as finetune_v0

val_fraction: 0.1

extra:
  # --- New for this experiment: model type + overlay-branch config ---
  model_type: bayar_fusion

  overlay: # -> cfg.extra["overlay"], read by build_bayar_fusion_model / FreuidDataset
    crop_size: 224 # matches feat/overlay-detector's own input size
    crop_margin: 0.75 # matches feat/overlay-detector's own crop_margin
    noise_feat_dim: 128
    rgb_backbone: resnet34
    rgb_pretrained: true
    fusion_dropout: 0.3
    fusion_gate_init: 1.0e-3 # LayerScale-style near-zero init, same as ConsistencyHead's
    # patch_gate/face_gate -- starts close to DINOv2-only behavior, "opens" the overlay
    # pathway only as it earns its keep (see the S3 postmortem in CLAUDE.md)

  # Augmentation: print-and-capture pipeline (no flip) -- unchanged from finetune_v0.
  # Applied independently to the whole-document view AND the 224px face-crop view (each
  # its own recapture_transforms instance) -- a deliberate v0 simplification, not a
  # shared-source degradation. See the exp/bayar+dinov2 plan for why.
  augment: recapture

  # Synthetic tamper: 30% of bona-fide per batch become synthetic positives -- unchanged.
  # On the tampered path the face-crop view is a placeholder (black image) with face_meta
  # marked invalid, so the fusion gate zeroes the overlay branch's contribution outright --
  # matches the existing "tampering invalidates the cached face box" convention.
  synth_tamper_prob: 0.3

  # Pairwise soft-AUC term -- unchanged
  auc_loss_weight: 0.1

  # Recapture probe: the compass -- unchanged
  use_recapture_probe: true
  recapture_probe_seed: 1234
  checkpoint_metric: probe_audet

  # Inference: TTA at three scales for the whole-document view, multiples of patch_size=14
  # (same triplet as finetune_v0) -- the face-crop view stays fixed at overlay.crop_size
  # across all three scales (see predict_scores_tta).
  tta: [476, 518, 560]

  missing_id_score: 0.5

  val_doc_types:
    - EGYPT/DL
    - GUINEA/DL
    - BENIN/DL
    - MOZAMBIQUE/DL
    - MAURITIUS/ID

  # --- Layer-wise LR decay fine-tuning -- unchanged from finetune_v0 ---
  # Applies to the dino sub-module only; overlay/gate/fusion get their own base-LR groups
  # (see build_bayar_fusion_param_groups in src/freuid/models/bayar_fusion.py).
  llrd:
    enabled: true
    decay: 0.7
    warmup_epochs: 2

  # Fallback if full fine-tune doesn't fit batch_size=32: freeze all but the last k
  # transformer blocks + head. null = full fine-tune (default for this run). Not yet
  # verified for bayar_fusion (only checked feasible for the plain baseline path).
  train_last_k_blocks: null

  # torch gradient checkpointing on the dino sub-module -- only turn on if needed to fit
  # batch_size=32 in memory (the extra overlay-stream activations add some memory on top
  # of finetune_v0's own footprint at the same resolution).
  grad_checkpointing: false

  # AMP (autocast + GradScaler) -- unchanged from finetune_v0.
  amp: true
